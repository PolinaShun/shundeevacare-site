name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Sync files to FTP
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./
        server-dir: /www/shundeevacare.ru/
        protocol: ftp
        timeout: 60000
        # ВНИМАНИЕ: dangerous-clean-slate убран 18.09.2026.
        # Он сначала полностью чистит каталог на хостинге, и если синк потом
        # падает (а 18.09 он упал), сайт остаётся пустым: index.html → 404,
        # на / — 403. Без clean-slate неудачный деплой ничего не ломает.
        exclude: |
          **/.git*
          **/.git*/**
          **/CLAUDE-CONTEXT.md
          **/MATERIALS-GUIDE.md
          **/INSTRUCTIONS.md
          **/*.zip
          **/*.docx
