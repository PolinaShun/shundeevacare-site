name: Deploy Website

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest
    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    # Файлы заливаются своим скриптом, а не готовым FTP-экшеном.
    # Причина: FTP хостинга периодически не присылает финальный ответ 226
    # («Timeout (control socket)»), готовые экшены на этом падают, хотя файл залит.
    # Скрипт проверяет результат по РАЗМЕРУ файла на сервере и повторяет попытки.
    # Подробности и локальный прогон: scripts/ftp_deploy.py (DRY_RUN=1 — только проверка).
    - name: Deploy via FTP (retries + size verification)
      env:
        FTP_SERVER: ${{ secrets.FTP_SERVER }}
        FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
        FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      run: python3 scripts/ftp_deploy.py
